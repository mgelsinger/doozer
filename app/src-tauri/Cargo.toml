[package]
name = "doozer"
version = "0.1.0"
description = "Doozer - a desktop virtual pet"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "doozer_lib"

[features]
# Test hooks for the Phase 3 shell spike: synthetic cursor probes, screen capture,
# a backdrop window. Never part of a normal build; see docs/shell-spike.md.
spike = [
  "windows/Win32_Graphics_Direct3D",
  "windows/Win32_Graphics_Direct3D11",
  "windows/Win32_Graphics_Dxgi",
  "windows/Win32_Graphics_Dxgi_Common",
]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.5", features = ["tray-icon"] }

[target.'cfg(windows)'.dependencies]
# Same version Tauri itself uses, so there is only one copy in the build.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# "Start with Windows" (src/autostart.rs). Already in the build through tauri-build.
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
