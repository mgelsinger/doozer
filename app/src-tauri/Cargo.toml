[package]
name = "doozer"
version = "0.1.0"
description = "Doozer - a desktop virtual pet"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "doozer_lib"

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.5", features = [] }
